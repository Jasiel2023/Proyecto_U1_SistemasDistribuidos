name: votacion-resultados

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: votacion-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - resultados-network

  resultados-db:
    image: postgres:17-alpine
    container_name: votacion-resultados-db
    environment:
      POSTGRES_DB: ${RESULTADOS_DB_NAME:-resultadosdb}
      POSTGRES_USER: ${RESULTADOS_DB_USER:-resultados}
      POSTGRES_PASSWORD: ${RESULTADOS_DB_PASSWORD:-resultados}
    volumes:
      - resultados-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${RESULTADOS_DB_USER:-resultados} -d ${RESULTADOS_DB_NAME:-resultadosdb}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - resultados-network

  resultados-service:
    build:
      context: ./services/resultados-service
    container_name: votacion-resultados
    environment:
      SPRING_PROFILES_ACTIVE: container
      RESULTADOS_DB_URL: jdbc:postgresql://resultados-db:5432/${RESULTADOS_DB_NAME:-resultadosdb}
      RESULTADOS_DB_USER: ${RESULTADOS_DB_USER:-resultados}
      RESULTADOS_DB_PASSWORD: ${RESULTADOS_DB_PASSWORD:-resultados}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}

      RESULTADOS_EXCHANGE: votacion.exchange
      RESULTADOS_ROUTING_KEY: voto.emitido
      RESULTADOS_QUEUE: votos.procesados
      RESULTADOS_DLQ: votos.procesados.dlq

      RESULTADOS_CORS_ALLOWED_ORIGINS: ${RESULTADOS_CORS_ALLOWED_ORIGINS}
      RESULTADOS_WS_ALLOWED_ORIGINS: ${RESULTADOS_WS_ALLOWED_ORIGINS}
    ports:
      - "8083:8083"
    depends_on:
      resultados-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - resultados-network

volumes:
  rabbitmq_data:
  resultados-db-data:

networks:
  resultados-network:
    driver: bridge