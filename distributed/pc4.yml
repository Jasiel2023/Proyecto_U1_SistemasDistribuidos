name: votacion-pc4

include:
  - ../services/resultados-service/docker-compose.yml

services:
  resultados-service:
    build:
      context: ../services/resultados-service
      dockerfile: Dockerfile
    container_name: votacion-resultados
    environment:
      SPRING_PROFILES_ACTIVE: container
      RESULTADOS_DB_URL: ${RESULTADOS_DB_URL:-jdbc:postgresql://resultados-db:5432/resultadosdb}
      RESULTADOS_DB_USER: ${RESULTADOS_DB_USER:-resultados}
      RESULTADOS_DB_PASSWORD: ${RESULTADOS_DB_PASSWORD:-resultados}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-100.82.125.26}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      RESULTADOS_EXCHANGE: ${RESULTADOS_EXCHANGE:-votacion.exchange}
      RESULTADOS_ROUTING_KEY: ${RESULTADOS_ROUTING_KEY:-voto.emitido}
      RESULTADOS_QUEUE: ${RESULTADOS_QUEUE:-votos.procesados}
      RESULTADOS_DLQ: ${RESULTADOS_DLQ:-votos.procesados.dlq}
      RESULTADOS_CORS_ALLOWED_ORIGINS: ${RESULTADOS_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RESULTADOS_WS_ALLOWED_ORIGINS: ${RESULTADOS_WS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8083:8083"
    depends_on:
      resultados-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
