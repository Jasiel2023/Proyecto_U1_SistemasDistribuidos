name: votacion-pc3

include:
  - ../services/votacion-service/docker-compose.yml

services:
  votacion-service:
    # RabbitMQ vive en PC1, no como servicio de este proyecto.
    depends_on: !override
      postgres-votacion:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-100.82.125.26}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
