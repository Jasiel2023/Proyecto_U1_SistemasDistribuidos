name: votacion-pc1

include:
  - ../services/api-gateway/docker-compose.yml
  - ../services/usuario-service/docker-compose.yml

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: votacion-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - votacion-network

  # El compose incluido del gateway tiene las URIs hardcodeadas a nombres
  # internos. En modo distribuido PC1 debe apuntar a las IPs de las otras PCs.
  api-gateway:
    environment:
      AUTH_SERVICE_URI: ${AUTH_SERVICE_URI:-http://votacion-autenticacion-service:8081}
      USUARIO_SERVICE_URI: ${USUARIO_SERVICE_URI:-http://usuario-service:8084}
      VOTACION_SERVICE_URI: ${VOTACION_SERVICE_URI:-http://votacion-service:8082}
      RESULTADOS_URL: ${RESULTADOS_URL:-http://resultados-service:8083}
      RESULTADOS_WS_URL: ${RESULTADOS_WS_URL:-ws://resultados-service:8083/ws}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      GATEWAY_WS_ALLOWED_ORIGINS: ${GATEWAY_WS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}

  frontend:
    build: ../frontend
    container_name: votacion-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - votacion-network

volumes:
  rabbitmq_data:

networks:
  votacion-network:
    external: true
    name: votacion-network
