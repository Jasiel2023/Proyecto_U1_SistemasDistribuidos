services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: votacion/api-gateway:0.0.1-SNAPSHOT
    container_name: votacion-api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      AUTH_SERVICE_URI: ${AUTH_SERVICE_URI:-http://votacion-autenticacion-service:8081}
      USUARIO_SERVICE_URI: ${USUARIO_SERVICE_URI:-http://votacion-usuario-service:8084}
      VOTACION_SERVICE_URI: ${VOTACION_SERVICE_URI:-http://votacion-votacion-service:8082}
      RESULTADOS_URL: ${RESULTADOS_URL:-http://resultados-service:8083}
      RESULTADOS_WS_URL: ${RESULTADOS_WS_URL:-ws://resultados-service:8083/ws}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      GATEWAY_WS_ALLOWED_ORIGINS: ${GATEWAY_WS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    networks:
      - votacion-network

networks:
  votacion-network:
    external: true
    name: votacion-network