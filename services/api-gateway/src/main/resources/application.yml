server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          websocket:
            allowed-origins: ${GATEWAY_WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
          routes:
            - id: resultados-api
              uri: ${RESULTADOS_URL:http://localhost:8083}
              predicates:
                - Path=/api/resultados/**


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
