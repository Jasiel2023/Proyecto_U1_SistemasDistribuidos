server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: autenticacion-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: votacion-service
              uri: ${VOTACION_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/votos/**,/api/elecciones/**,/api/admin/**
