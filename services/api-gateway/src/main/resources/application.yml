server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: autenticacion-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: usuario-service
              uri: ${USUARIO_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/usuarios/**
            - id: votacion-service
              uri: ${VOTACION_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/votos/**

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:mySecretKeyForJwtSigning12345678901234567890}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}