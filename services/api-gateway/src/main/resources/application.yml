server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: votacion-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/votos/**
            - id: resultados-service
              uri: ${RESULTADOS_URL:http://localhost:8083}
              predicates:
                - Path=/api/resultados/**
