spring:
  application:
    name: resultados-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 5s

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

resultados:
  messaging:
    exchange: ${RESULTADOS_EXCHANGE:votacion.exchange}
    routing-key: ${RESULTADOS_ROUTING_KEY:voto.emitido.v1}
    queue: ${RESULTADOS_QUEUE:resultados.voto-emitido.v1}
    dlx: ${RESULTADOS_DLX:votacion.dlx}
    dlq: ${RESULTADOS_DLQ:resultados.voto-emitido.v1.dlq}
    dl-routing-key: ${RESULTADOS_DL_ROUTING_KEY:voto.emitido.v1.dlq}
  websocket:
    endpoint: /ws
    topic-prefix: /topic/resultados/elecciones
    allowed-origins: ${RESULTADOS_WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
  cors:
    allowed-origins: ${RESULTADOS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
