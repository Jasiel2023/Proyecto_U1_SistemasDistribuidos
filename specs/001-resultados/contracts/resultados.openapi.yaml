openapi: 3.1.0
info:
  title: Resultados API
  version: 1.0.0
  description: |
    API de solo lectura del módulo de Resultados. No existen endpoints para alterar conteos.
    Los resultados son públicos en el perfil local del MVP. No se expone identidad de votantes.
servers:
  - url: http://localhost:8080
    description: Gateway local
  - url: http://localhost:8083
    description: Servicio Resultados directo (desarrollo)
paths:
  /api/resultados/elecciones/{eleccionId}:
    get:
      operationId: obtenerResultadosPorEleccion
      summary: Consulta el snapshot confirmado de una elección
      description: |
        Devuelve la proyección persistida. Si no existe proyección para el UUID, devuelve
        un snapshot vacío con disponible=false. No verifica ni afirma la existencia de la
        elección en Votación. La lectura de resumen y conteos es consistente.
      parameters:
        - name: eleccionId
          in: path
          required: true
          description: UUID de la elección
          schema:
            type: string
            format: uuid
          example: 4f1c1a1e-6f31-4f7e-9f0a-2f4d0f6a1b12
      responses:
        '200':
          description: Snapshot confirmado (posiblemente vacío)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoSnapshot'
              examples:
                conDatos:
                  value:
                    eleccionId: 4f1c1a1e-6f31-4f7e-9f0a-2f4d0f6a1b12
                    totalVotos: 3
                    conteos:
                      - candidatoId: 4f1c1a1e-6f31-4f7e-9f0a-2f4d0f6a1b13
                        votos: 2
                      - candidatoId: 4f1c1a1e-6f31-4f7e-9f0a-2f4d0f6a1b14
                        votos: 1
                    revision: 3
                    ultimaActualizacion: '2026-11-08T15:04:06Z'
                    disponible: true
                sinProyeccion:
                  value:
                    eleccionId: 4f1c1a1e-6f31-4f7e-9f0a-2f4d0f6a1b99
                    totalVotos: 0
                    conteos: []
                    revision: 0
                    ultimaActualizacion: null
                    disponible: false
        '400':
          description: UUID de elección con formato inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: El identificador de elección no es un UUID válido.
        '500':
          description: Error interno no recuperable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  schemas:
    ResultadoSnapshot:
      type: object
      additionalProperties: false
      required:
        - eleccionId
        - totalVotos
        - conteos
        - revision
        - ultimaActualizacion
        - disponible
      properties:
        eleccionId:
          type: string
          format: uuid
        totalVotos:
          type: integer
          format: int64
          minimum: 0
          description: Igual a la suma de votos de conteos.
        conteos:
          type: array
          items:
            $ref: '#/components/schemas/ConteoCandidato'
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Revisión monotónica por elección; 0 si no hay proyección.
        ultimaActualizacion:
          type: [string, 'null']
          format: date-time
          description: Instante UTC de la última actualización confirmada; null si no hay proyección.
        disponible:
          type: boolean
          description: true si existe una proyección persistida; no implica que la elección exista en Votación.
    ConteoCandidato:
      type: object
      additionalProperties: false
      required:
        - candidatoId
        - votos
      properties:
        candidatoId:
          type: string
          format: uuid
        votos:
          type: integer
          format: int64
          minimum: 0
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
