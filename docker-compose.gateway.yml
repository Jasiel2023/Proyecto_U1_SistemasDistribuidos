name: votacion-gateway

services:
  api-gateway:
    build:
      context: ./services/api-gateway
    image: votacion/api-gateway:distributed
    container_name: votacion-api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URI: http://100.72.69.83:8081
      USUARIO_SERVICE_URI: http://100.82.125.26:8084
      VOTACION_SERVICE_URI: http://100.117.1.27:8082
      RESULTADOS_URL: http://100.117.1.27:8083
      RESULTADOS_WS_URL: ws://100.117.1.27:8083/ws

      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_WS_ALLOWED_ORIGINS: http://100.72.69.83:3000
      CORS_ALLOWED_ORIGINS: http://100.72.69.83:3000
    networks:
      - gateway-network

  frontend:
    build:
      context: ./frontend
    container_name: votacion-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge